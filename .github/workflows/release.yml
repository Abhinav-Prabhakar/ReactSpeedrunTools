name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Bundle extension
        run: npm run bundle

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package -- --out react-speedrun-tools.vsix

      - name: Publish to Marketplace
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set; skipping Marketplace publish."
            exit 0
          fi
          npx vsce publish --packagePath react-speedrun-tools.vsix --pat "$VSCE_PAT"

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" react-speedrun-tools.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" react-speedrun-tools.vsix --generate-notes --verify-tag
          fi
