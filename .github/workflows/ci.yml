name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Bundle extension
        run: npm run bundle

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package -- --out react-speedrun-tools.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: react-speedrun-tools-vsix
          path: react-speedrun-tools.vsix
          if-no-files-found: error
